{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>📊 Automatic Graphs</h1><p>Graphs use the live database values and update when data is saved.</p></div></div><div class="chart-grid"><section class="panel chart-card"><h2>Residual strength (%) vs temperature</h2><canvas id="curve"></canvas></section><section class="panel chart-card"><h2>Mass loss (%) vs temperature</h2><canvas id="mass"></canvas></section><section class="panel chart-card wide"><h2>Residual strength at 800°C by mix</h2><canvas id="bar"></canvas></section><section class="panel chart-card wide"><h2>4M vs 6M at 800°C</h2><canvas id="molar"></canvas></section></div><script>const S={{summary|tojson}};const T={{temps|tojson}};const labels=S.map(x=>x.mix_id);const datasets=(key)=>S.map(x=>({label:x.mix_id,data:T.map(t=>x[String(t)]),borderWidth:2,fill:false,tension:.25}));new Chart(document.getElementById('curve'),{type:'line',data:{labels:T,datasets:datasets('res')},options:{responsive:true,spanGaps:false}});new Chart(document.getElementById('mass'),{type:'line',data:{labels:T,datasets:S.map(x=>({label:x.mix_id,data:T.map(t=>x['ml'+t]),borderWidth:1,fill:false,tension:.2}))},options:{responsive:true}});new Chart(document.getElementById('bar'),{type:'bar',data:{labels:labels,datasets:[{label:'Residual strength % at 800°C',data:S.map(x=>x['800']),borderWidth:1}]},options:{responsive:true}});new Chart(document.getElementById('molar'),{type:'bar',data:{labels:['0%','5%','10%','15%','20%','25%'],datasets:[{label:'4M',data:S.filter(x=>x.naoh==='4M').map(x=>x['800']),borderWidth:1},{label:'6M',data:S.filter(x=>x.naoh==='6M').map(x=>x['800']),borderWidth:1}]},options:{responsive:true}});</script>{% endblock %}
