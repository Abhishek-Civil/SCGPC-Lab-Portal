<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCGPC Fire Lab Portal</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav><div class="brand">🔥 SCGPC FIRE LAB</div>{% if current_user %}<div class="navlinks"><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('entry')}}">Data Entry</a><a href="{{url_for('charts')}}">Graphs</a><a href="{{url_for('results')}}">Results</a><a href="{{url_for('excel')}}">Excel</a>{% if role=='admin' %}<a href="{{url_for('admin')}}">Admin</a>{% endif %}<a href="{{url_for('logout')}}">Logout</a></div>{% endif %}</nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
